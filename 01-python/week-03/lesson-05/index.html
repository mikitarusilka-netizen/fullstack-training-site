    <meta name="color-scheme" content="light dark">

        js_staticrypt, is_remember_enabled, staticrypt_config. All text is
        written here, so no --template-* flags are passed.
        Visual direction "Тетрадь": tokens below are fixed, system fonts only,
        no external requests.

            --border: #E3E1DC;
            --control-border: #767470;
            --hover: #F7F6F3;
            --focus: #1A4F7D;
            --error-text: #5A1F18;
            --error-bg: #F7E0DC;
            --button-bg: #222222;
            --button-text: #FFFFFF;
            --button-hover: #000000;
            --font-body: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
            /* Same stack as the site (lessons/assets/extra.css). Android has no
               Georgia: Noto Serif (Android 7+) and Droid Serif (older) ship with
               it and are as wide as Georgia. Nothing is downloaded. */
            --font-heading: Georgia, "Noto Serif", "Droid Serif", "Times New Roman", serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1A1917;
                --surface: #232220;
                --field: #1A1917;
                --text: #ECEAE4;
                --muted: #B8B5AD;
                --border: #3A3835;
                --control-border: #8A8780;
                --hover: #1A1917;
                --focus: #8FBCE6;
                --error-text: #F4C7BE;
                --error-bg: #3B1F1A;
                --button-bg: #ECEAE4;
                --button-text: #1A1917;
                --button-hover: #FFFFFF;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        .staticrypt-html {
            height: 100%;
        }

        .staticrypt-body {
            min-height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 1.1875rem;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        .hidden {
            display: none !important;
        }

        /* Shown only if opening the page takes longer than a second. */
        .staticrypt-loading {
            margin: 0;
            padding: 48px 16px;
            text-align: center;
            color: var(--muted);
            opacity: 0;
            animation: staticrypt-appear 0s 1s forwards;
        }

        @keyframes staticrypt-appear {
            to { opacity: 1; }
        }

        .staticrypt-content {
            padding: 48px 16px;
        }

        .staticrypt-card {
            max-width: 27rem;
            margin: 0 auto;
            padding: 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        /* Lining figures wherever the heading font is set, as on the site:
           Georgia's default figures are old-style, so a zero would be as small
           and round as the letter «о». "lnum" is the same request for older
           engines. */
        .staticrypt-title {
            margin: 0 0 24px;
            font-family: var(--font-heading);
            font-variant-numeric: lining-nums;
            font-feature-settings: "lnum" 1;
            font-size: 2rem;
            font-weight: 600;
            line-height: 1.2;
        }

        .staticrypt-label {
            display: block;
            font-weight: 600;
        }

        .staticrypt-hint {
            margin: 4px 0 8px;
            color: var(--muted);
            font-size: 1.125rem;
        }

        .staticrypt-input {
            display: block;
            width: 100%;
            margin: 0;
            padding: 12px 16px;
            font: inherit;
            color: var(--text);
            background: var(--field);
            border: 2px solid var(--control-border);
            border-radius: 6px;
        }

        .staticrypt-input[aria-invalid="true"] {
            border-color: var(--error-text);
        }

        .staticrypt-notice {
            margin: 8px 0 0;
            font-weight: 600;
        }

        .staticrypt-error {
            margin: 12px 0 0;
            padding: 12px 16px;
            color: var(--error-text);
            background: var(--error-bg);
            border-radius: 6px;
            font-weight: 600;
        }

        /* Empty live regions stay in the page (so they are announced) but take no space. */
        .staticrypt-notice:empty,
        .staticrypt-error:empty {
            margin: 0;
            padding: 0;
        }

        .staticrypt-toggle-password-visibility {
            min-height: 44px;
            margin-top: 16px;
            padding: 8px 16px;
            font: inherit;
            font-size: 1.125rem;
            color: var(--text);
            background: transparent;
            border: 1px solid var(--control-border);
            border-radius: 6px;
            cursor: pointer;
        }

        .staticrypt-toggle-password-visibility:hover {
            background: var(--hover);
            border-color: var(--text);
        }

        .staticrypt-toggle-password-visibility:active {
            background: var(--border);
        }

        .staticrypt-decrypt-button {
            display: block;
            width: 100%;
            min-height: 48px;
            margin-top: 24px;
            padding: 12px 16px;
            font: inherit;
            font-weight: 600;
            color: var(--button-text);
            background: var(--button-bg);
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
        }

        .staticrypt-decrypt-button:hover,
        .staticrypt-decrypt-button:active {
            background: var(--button-hover);
        }

        :focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        .staticrypt-noscript {
            max-width: 27rem;
            margin: 48px auto;
            padding: 0 16px;
        }

        /* At 320 px wide «Учебный сайт» in 2rem misses one line by 2 px;
           1.875rem keeps it on one line, with room for Android's Noto Serif. */
        @media (max-width: 22.5em) {
            .staticrypt-title {
                font-size: 1.875rem;
            }
        }

        @media (min-width: 30em) {
            .staticrypt-card {
                padding: 32px;
            }
        }

        @media (min-width: 40em) and (min-height: 40em) {
            .staticrypt-content {
                padding-top: 96px;
            }
        }

        /* A phone with the keyboard open has about 420 px of page: less
           space above the form, a smaller title and tighter gaps keep the
           submit button above the keyboard even with the error shown.
           Last, so it wins over the width rules above. */
        @media (max-height: 34em) {
            .staticrypt-content {
                padding-top: 16px;
                padding-bottom: 16px;
            }
            .staticrypt-card {
                padding: 16px;
            }
            .staticrypt-title {
                margin-bottom: 12px;
                font-size: 1.5rem;
            }
            .staticrypt-error {
                margin-top: 8px;
                padding: 8px 12px;
            }
            .staticrypt-decrypt-button {
                margin-top: 16px;
            }
        }
    </style>
    <noscript><style>#staticrypt_loading { display: none; }</style></noscript>
</head>

            // Every label and message the script shows. The two buttons also get

            function storageWorks() {
